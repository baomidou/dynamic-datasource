# Dependabot version updates.
#
# Notes for this repository:
# - The "gradle" ecosystem resolves the multi-project build from the root; the version
#   catalog (gradle/libs.versions.toml) is the single source of truth, so bumps land there.
# - The wrapper is a *source-built* Gradle Wrapper Neo fork (gradle-wrapper.jar is generated
#   on demand and checked against distributionSha256Sum). Wrapper version bumps therefore need
#   the sha256 regenerated by hand - review those PRs carefully instead of auto-merging.
# - GitHub also has "security updates" for this repo; that is a repository setting
#   (Settings → Security → Dependabot) and is separate from the version updates below.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    # 依赖更新 PR 进开发分支（main 是稳定发布线）
    target-branch: "dev"
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: Asia/Shanghai
    # 冷却期：新版本发布后等 7 天再提，避开被投毒/撤回的发布（supply-chain 最佳实践）
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: build
      include: scope
    groups:
      # One grouped PR per minor/patch bump set keeps the noise down on a 7-module build.
      gradle-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Boot 4 line is brand new; its milestones/RCs must not be auto-adopted.
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-prerelease"]

  - package-ecosystem: github-actions
    directory: /
    # action 版本更新同样进开发分支
    target-branch: "dev"
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
