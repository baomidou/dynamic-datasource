name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # manual trigger for troubleshooting CI/toolchain problems without opening a PR
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

jobs:
  test-graalvm-ce-ci:
    # TODO Temporarily disabled; GraalVM nativeTest CI will be fixed in a follow-up PR
    if: false
    name: NativeTest CI - GraalVM CE ${{ matrix.java-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        java-version: [ '21.0.1' ]
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'gradle'
      - name: Build Spring Boot Starter 3 test with Gradle
        run: |
          ./gradlew :dynamic-datasource-spring-boot3-starter:nativeTest --no-daemon
  test-jdk-ci:
    if: github.repository == 'baomidou/dynamic-datasource'
    name: Test CI - JDK ${{ matrix.java-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        java-version: [ '17', '21', '25' ]
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK ${{ matrix.java-version }} (Gradle runtime)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
          cache: 'gradle'
      - name: Build test with Gradle
        run: ./gradlew clean test --no-daemon --parallel
  test-jdk8-ci:
    if: github.repository == 'baomidou/dynamic-datasource'
    name: Test CI - JDK 8 toolchain on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17 (Gradle runtime)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Build test with Gradle (tests run on the JDK 8 toolchain)
        run: ./gradlew :dynamic-datasource-spring-boot-starter:clean :dynamic-datasource-spring-boot-starter:test --no-daemon
  # Fail early on PRs that introduce a dependency with a known vulnerability.
  # GitHub-native action, no build-time dependency added to the project itself.
  dependency-review:
    if: github.event_name == 'pull_request' && github.repository == 'baomidou/dynamic-datasource'
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          comment-mode: summary
          fail-on-severity: high
