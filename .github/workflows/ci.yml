name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # manual trigger for troubleshooting CI/toolchain problems without opening a PR
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-graalvm-ce-ci:
    name: NativeTest CI - GraalVM CE ${{ matrix.version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        version: [ '25.3.4.1' ]
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          version: ${{ matrix.version }}
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'gradle'
          native-image-job-reports: 'true'
      - name: Run nativeTest for all starters with Gradle
        run: ./gradlew nativeTest --continue
  test-jdk-ci:
    if: github.repository == 'baomidou/dynamic-datasource'
    name: Test CI - JDK ${{ matrix.java-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        java-version: [ '17', '21', '25', '27' ]
    steps:
      - uses: actions/checkout@v7
      - name: Setup JDK ${{ matrix.java-version }} (Gradle runtime)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
          cache: 'gradle'
      - name: Build test with Gradle
        run: ./gradlew clean test
  # Fail early on PRs that introduce a dependency with a known vulnerability.
  # GitHub-native action, no build-time dependency added to the project itself.
  dependency-review:
    if: github.event_name == 'pull_request' && github.repository == 'baomidou/dynamic-datasource'
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          comment-mode: summary
          fail-on-severity: high
