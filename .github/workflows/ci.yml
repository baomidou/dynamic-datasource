name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # manual trigger for troubleshooting CI/toolchain problems without opening a PR
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-graalvm-ce-ci:
    name: NativeTest CI - ${{ matrix.starter }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        version: [ '25.3.4.1' ]
        # 按 starter 拆腿：native-image 编译（每腿约 5 分钟）是 wall time 大头，串行两条不如并行两条。
        # nativeTest 已稳定修复（#760/#788），不再用 continue-on-error 容忍失败。
        starter: [ 'dynamic-datasource-spring-boot3-starter', 'dynamic-datasource-spring-boot4-starter' ]
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          version: ${{ matrix.version }}
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'gradle'
          native-image-job-reports: 'true'
      - name: Run nativeTest for ${{ matrix.starter }}
        run: ./gradlew :${{ matrix.starter }}:nativeTest
  test-jdk-ci:
    if: github.repository == 'baomidou/dynamic-datasource'
    name: Test CI - JDK ${{ matrix.java-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        java-version: [ '17', '21', '25', '27' ]
    steps:
      - uses: actions/checkout@v7
      - name: Setup JDK ${{ matrix.java-version }} (Gradle runtime)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
          cache: 'gradle'
      - name: Build test with Gradle
        run: ./gradlew clean test
      # 覆盖率只在 JDK 17 这一腿采集：矩阵各腿跑的是同一套测试，重复生成没有信息量。
      # 复用上面 test 已经写出的 build/jacoco/test.exec，jacocoRootReport 里的 test 依赖会命中
      # up-to-date，不会重跑测试。报告不入 build/check，也不接外部徽章服务。
      - name: Generate aggregated coverage report
        if: matrix.java-version == '17'
        run: ./gradlew jacocoRootReport
      - name: Upload coverage report
        if: matrix.java-version == '17'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-jdk${{ matrix.java-version }}-${{ matrix.os }}
          path: |
            build/reports/jacoco/jacocoRootReport/jacocoRootReport.xml
            build/reports/jacoco/jacocoRootReport/html/
          if-no-files-found: error
          retention-days: 14
  # Fail early on PRs that introduce a dependency with a known vulnerability.
  # GitHub-native action, no build-time dependency added to the project itself.
  dependency-review:
    if: github.event_name == 'pull_request' && github.repository == 'baomidou/dynamic-datasource'
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          comment-mode: summary
          fail-on-severity: high
