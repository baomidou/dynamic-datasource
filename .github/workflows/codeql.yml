name: CodeQL
# 代码级漏洞扫描（与 dependency-scan 的依赖漏洞互补，覆盖仓库自身代码）。
# Java 走 autobuild：CodeQL 自动执行 Gradle 构建（toolchain JDK 8/17 由 foojay 自动供给）。
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  schedule:
    # 周六 02:15 UTC = 10:15 北京时间
    - cron: '15 2 * * 6'
  workflow_dispatch:

# 顶层只给最小读权限，security-events: write 下放到需要上传 SARIF 的 job
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze java
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup JDK 17 (Gradle runtime)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: java
      - name: Autobuild
        uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: "/language:java"
