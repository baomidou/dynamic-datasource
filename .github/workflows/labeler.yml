name: Labeler
# 按 PR 变更路径自动打标签（规则见 .github/labeler.yml）。
# pull_request_target 是官方推荐用法：fork PR 需要写权限才能打标签，
# 而 labeler 只经 API 读取变更文件列表，不检出 PR 代码。
on:
  pull_request_target:
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@v7
