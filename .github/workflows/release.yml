name: Publish package to the Maven Central Repository
on:
  push:
    tags:
      - v*

permissions:
  contents: read
  # artifact attestations（Sigstore 来源证明）：id-token 用于签发，attestations 用于上传
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # 发布构建的公开 build scan（Develocity 免费公开版），构建性能问题可追溯
          build-scan-publish: true
          build-scan-terms-of-use-url: https://gradle.com/terms-of-service
          build-scan-terms-of-use-agree: 'yes'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Release gate: publishing to Maven Central is irreversible, so the tag must not be
      # able to ship artifacts that were never tested. This used to be `build -x test`.
      - name: Build and test
        run: ./gradlew clean build

      - name: Publish package to maven central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SECRET_KEY }}
        # Configuration cache is disabled here on purpose:
        # io.spring.dependency-management's POM withXml() is not cache-safe
        # ("this.delegate is null" on cache-miss generation). Test/build jobs keep the cache.
        run: ./gradlew publishAllPublicationsToMavenCentralRepository --no-configuration-cache

      # SBOM for exactly the tree that was just published, kept with the run (and downloadable
      # for attaching to the GitHub Release).
      - name: Generate CycloneDX SBOM
        run: ./gradlew cyclonedxBom
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.ref_name }}
          path: build/reports/cyclonedx/bom.json
          if-no-files-found: error

      # Sigstore 来源证明：证明所发布的构件（及 SBOM）确由本仓库的本次工作流构建。
      # 消费方可对下载的构件执行 `gh attestation verify <file> --repo baomidou/dynamic-datasource`。
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dynamic-datasource-creator/build/libs/*.jar
            dynamic-datasource-spring/build/libs/*.jar
            dynamic-datasource-spring-boot-common/build/libs/*.jar
            dynamic-datasource-spring-boot-starter/build/libs/*.jar
            dynamic-datasource-spring-boot3-starter/build/libs/*.jar
            dynamic-datasource-spring-boot4-starter/build/libs/*.jar
            dynamic-datasource-native-metadata/build/libs/*.jar
      - name: Attest SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-path: |
            dynamic-datasource-creator/build/libs/*.jar
            dynamic-datasource-spring/build/libs/*.jar
            dynamic-datasource-spring-boot-common/build/libs/*.jar
            dynamic-datasource-spring-boot-starter/build/libs/*.jar
            dynamic-datasource-spring-boot3-starter/build/libs/*.jar
            dynamic-datasource-spring-boot4-starter/build/libs/*.jar
            dynamic-datasource-native-metadata/build/libs/*.jar
          sbom-path: build/reports/cyclonedx/bom.json