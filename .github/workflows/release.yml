name: Publish package to the Maven Central Repository
on:
  push:
    tags:
      - v*

# 顶层只保留读权限：id-token / attestations 只有 build job 需要（见该 job 的 permissions），
# 留在顶层会一并授予 notify-samples job，触发 zizmor excessive-permissions。
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # artifact attestations（Sigstore 来源证明）：id-token 用于签发，attestations 用于上传
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          # 发布构建的公开 build scan（Develocity 免费公开版），构建性能问题可追溯
          build-scan-publish: true
          build-scan-terms-of-use-url: https://gradle.com/terms-of-service
          build-scan-terms-of-use-agree: 'yes'
          # 发布链路不接受任何复用：关掉 Gradle 缓存以消除 cache-poisoning 面，
          # 发布是一次性低频操作，慢一点无所谓
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Release gate: publishing to Maven Central is irreversible, so the tag must not be
      # able to ship artifacts that were never tested. This used to be `build -x test`.
      - name: Build and test
        run: ./gradlew clean build

      - name: Publish package to maven central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SECRET_KEY }}
        # Configuration cache is disabled here on purpose:
        # io.spring.dependency-management's POM withXml() is not cache-safe
        # ("this.delegate is null" on cache-miss generation). Test/build jobs keep the cache.
        run: ./gradlew publishAllPublicationsToMavenCentralRepository --no-configuration-cache

      # SBOM for exactly the tree that was just published, kept with the run (and downloadable
      # for attaching to the GitHub Release).
      - name: Generate CycloneDX SBOM
        run: ./gradlew cyclonedxBom
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom-${{ github.ref_name }}
          path: build/reports/cyclonedx/bom.json
          if-no-files-found: error

      # Sigstore 来源证明：证明所发布的构件（及 SBOM）确由本仓库的本次工作流构建。
      # 消费方可对下载的构件执行 `gh attestation verify <file> --repo baomidou/dynamic-datasource`。
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dynamic-datasource-creator/build/libs/*.jar
            dynamic-datasource-spring/build/libs/*.jar
            dynamic-datasource-spring-boot-common/build/libs/*.jar
            dynamic-datasource-spring-boot-starter/build/libs/*.jar
            dynamic-datasource-spring-boot3-starter/build/libs/*.jar
            dynamic-datasource-spring-boot4-starter/build/libs/*.jar
            dynamic-datasource-native-metadata/build/libs/*.jar
      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
        with:
          subject-path: |
            dynamic-datasource-creator/build/libs/*.jar
            dynamic-datasource-spring/build/libs/*.jar
            dynamic-datasource-spring-boot-common/build/libs/*.jar
            dynamic-datasource-spring-boot-starter/build/libs/*.jar
            dynamic-datasource-spring-boot3-starter/build/libs/*.jar
            dynamic-datasource-spring-boot4-starter/build/libs/*.jar
            dynamic-datasource-native-metadata/build/libs/*.jar
          sbom-path: build/reports/cyclonedx/bom.json

  # 通知 samples 仓库对着"刚发布到 Central 的构件"跑全量集成测试。
  # samples 依赖的是发布产物而非源码（见 samples/pom.xml 的 ds.version），
  # 因此它的验收天然滞后一个发版周期；这里把滞后期压到发布后几分钟。
  #
  # 为什么是独立 job 而不是 build job 的最后一步：
  #   1) 发布不可逆，本 job 失败时构件已经出去了，把整个 run 标红会误导维护者
  #      以为发布失败 —— 故 continue-on-error，失败只作为告警；
  #   2) 认证用的是跨仓库 PAT（SAMPLES_DISPATCH_TOKEN），与发布凭据隔离。
  notify-samples:
    name: Trigger samples verification
    if: github.repository == 'baomidou/dynamic-datasource'
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - name: Resolve version from tag
        id: version
        # tag 形如 v4.6.0，samples 需要的是 4.6.0
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Dispatch ds-released to samples repo
        env:
          # 跨仓库（baomidou/* -> dynamic-datasource/*）dispatch，GITHUB_TOKEN 不够用，
          # 需要对目标仓库有写权限的 PAT：classic PAT 勾 repo，或 fine-grained 给
          # Contents: Read and write（若 dispatches 返回 403 再补 Actions: write）。
          GH_TOKEN: ${{ secrets.SAMPLES_DISPATCH_TOKEN }}
          # 一律经 env 传参，不在 run 脚本里直接做 ${{ }} 插值：version / tag 最终来自外部可控的
          # tag 名，拼进 shell 脚本会构成模板注入面。
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # 注意：不要用 `-F client_payload='{"version":"..."}'`，gh 会把整段 JSON
        # 当字符串发出去，服务端报 422 "For 'properties/client_payload', ... is not an object"。
        # 嵌套字段语法 `client_payload[key]=value` 才会真正构造出 object。
        run: |
          gh api repos/dynamic-datasource/dynamic-datasource-samples/dispatches \
            -X POST \
            -F event_type=ds-released \
            -F client_payload[version]="$VERSION" \
            -F client_payload[tag]="$TAG" \
            -F client_payload[run_url]="$RUN_URL"