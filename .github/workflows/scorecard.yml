name: Scorecard
# OpenSSF Scorecard：每周为供应链安全实践打分（branch protection、token 权限、
# actions 是否固定版本、危险 workflow 模式等），SARIF 进 Code Scanning，
# 分数同步到 scorecard.dev 可加 README 徽章。
on:
  branch_protection_rule:
  schedule:
    # 周六 01:30 UTC = 09:30 北京时间，与 dependency-scan 的时点错开
    - cron: '30 1 * * 6'
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write  # 上传 SARIF
      id-token: write         # publish_results 走 OIDC
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 14
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: results.sarif
