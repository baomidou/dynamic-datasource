name: zizmor
# 静态扫描 .github/workflows 自身的反模式（权限过大、表达式注入、未固定版本等），
# 结果以 SARIF 进入 Code Scanning；只在 workflow 文件变动时触发。
on:
  push:
    branches: [ main, dev ]
    paths: [ '.github/workflows/**' ]
  pull_request:
    paths: [ '.github/workflows/**' ]
  workflow_dispatch:

permissions: { }

jobs:
  zizmor:
    name: Analyze workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # zizmor 只读文件，不需要凭据
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # 上传 SARIF 到 Code Scanning（默认仅输出 SVG 摘要）
          advanced-security: true
