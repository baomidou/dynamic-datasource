// 编译脚本（依赖版本统一维护在 gradle/libs.versions.toml 版本目录）
buildscript {
    // 仓库配置：镜像仅作加速，明确 ordered；不启用 mavenLocal，保证构建可复现
    repositories {
        maven { url = 'https://maven.aliyun.com/repository/central' }
        maven { url = 'https://maven.aliyun.com/repository/spring' }
        maven { url = 'https://maven.aliyun.com/repository/google' }
        mavenCentral()
    }

    dependencies {
        classpath("io.spring.dependency-management:io.spring.dependency-management.gradle.plugin:1.1.7")
        // gradle-maven-publish-plugin 0.32.0 要求 JDK 11+，只在 JDK 11+ 环境下加载
        if (JavaVersion.current() >= JavaVersion.VERSION_11) {
            classpath("com.vanniktech:gradle-maven-publish-plugin:0.32.0")
        }
    }
}

plugins {
    // Gradle Wrapper Neo: source-based wrapper, no gradle-wrapper.jar stored in the repo
    // Manage the version via ./gradlew wrapperNeo --gradle-version <version>
    id 'org.glavo.gradle-wrapper-neo' version '0.2.0'
    // GraalVM Native Build Tools. `apply false`: a single plugin class loader is shared by all
    // subprojects (gradle/gradle#17559), and the starters apply it without a version.
    id 'org.graalvm.buildtools.native' version '1.1.13' apply false

    // SBOM (CycloneDX): applied on the root only. In 3.x this registers cyclonedxDirectBom on every
    // subproject and cyclonedxBom (the aggregate) here. Not wired into `build`/`check`; CI and the
    // release job invoke the task explicitly so ordinary developer builds pay no cost.
    id 'org.cyclonedx.bom' version '3.5.1'
}

description = "mybatis dynamic datasource"

// JaCoCo 版本单一来源：根项目（聚合报告用 jacocoAnt）与各模块（agent 用）必须同一版本，
// exec 文件由低版本 agent 写出会让高版本报告工具无法解析，反之亦然。
// 不能放进 gradle/libs.versions.toml：本变量要在 subprojects 块里被引用，而该块执行时
// 子项目尚未评估、拿不到版本目录（见 CONTRIBUTING.md 第 5 节约束 4）。
// 升级 JaCoCo 只改这一行。
def jacocoToolVersion = '0.8.15'

// 项目配置
allprojects {
    group = APP_GROUP
    version = APP_VERSION

    // 仓库配置：镜像仅作加速，明确 ordered；不启用 mavenLocal，保证构建可复现
    // ——本地仓库构件不可复现，CI/其他机器无法保证同版本依赖，且可能撞上本地陈旧快照。
    // 提到 allprojects 是因为根项目也需要解析（根任务的 jacocoAnt 配置，见文件末尾的
    // jacocoRootReport）：只在 subprojects 里声明会让根项目报
    // "Cannot resolve external dependency org.jacoco:org.jacoco.ant ... no repositories are defined"。
    repositories {
        maven { url = 'https://maven.aliyun.com/repository/central' }
        maven { url = 'https://maven.aliyun.com/repository/spring' }
        maven { url = 'https://maven.aliyun.com/repository/google' }
        // 仅供需要快照版依赖的开发机使用，当前无模块声明 -SNAPSHOT 依赖
        maven { url = "https://oss.sonatype.org/content/repositories/snapshots/" }
        mavenCentral()
    }
}

// 子模块配置
subprojects {
    apply plugin: 'java-library'

    // 只在 JDK 11+ 环境下应用发布插件 (gradle-maven-publish-plugin 0.32.0 要求 JDK 11+)
    // JDK 8 环境下仅运行测试，无需发布功能
    if (JavaVersion.current() >= JavaVersion.VERSION_11) {
        apply plugin: 'com.vanniktech.maven.publish'
        apply plugin: 'signing'
    }

    // 仓库配置见上方 allprojects：此处不重复声明，否则镜像/快照策略会在两处漂移

    // 依赖说明：slf4j-api 与 lombok（锁定版本以支持 JDK 25，见 gradle/libs.versions.toml）
    // 在各子模块 build.gradle 中声明——root 的 subprojects 块执行时子项目尚未评估，
    // 无法拿到其版本目录；而在 root 脚本里直接写 `libs` 会触发已弃用的隐式父项目属性查找，
    // Gradle 10 将报错

    // 默认编译环境 JDK-1.8+ (子模块可覆盖，如 boot3/boot4 使用 toolchain 17)
    // 用 toolchain 而非 source/targetCompatibility，避免 Gradle 9 元数据版本与
    // 模块 toolchain 不一致导致依赖解析被降级到 JVM 8
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(8)
        }
    }

    tasks.named('test') {
        useJUnitPlatform()
    }

    // 覆盖率：JaCoCo 是 Gradle 核心插件，不引入额外三方依赖。
    // 这里只为拿到 agent 与各模块的 build/jacoco/test.exec；对外/CI 看的报告是根任务的
    // jacocoRootReport（原因见文件末尾）。报告不接入 build/check，日常构建不付生成开销。
    apply plugin: 'jacoco'

    jacoco {
        toolVersion = jacocoToolVersion
    }

    tasks.withType(JacocoReport).configureEach {
        reports {
            xml.required = true
            html.required = true
            csv.required = false
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.warnings = false
        options.deprecation = true
        options.compilerArgs += ["-parameters", "-Xlint:unchecked", "-Xlint:-serial"]
    }

    tasks.withType(GenerateModuleMetadata).configureEach {
        enabled = false
    }

    // sourcesJar / javadocJar 由 gradle-maven-publish-plugin (vanniktech) 自动注册
    // （内部调用 java.withSourcesJar()/withJavadocJar() 并接入 publication），
    // 此处切勿再次手动添加，否则 publication 会出现重复构件报：
    // "multiple artifacts with the identical extension and classifier ('jar', 'javadoc')"
    javadoc {
        options {
            encoding = 'UTF-8'
            charSet = 'UTF-8'
            author = true
            version = true
            failOnError = false
            links = ["https://docs.oracle.com/javase/8/docs/api"]
        }
    }

    tasks.withType(MavenPublication).configureEach {
        doFirst {
            options.skipCertificateChecks = true
        }
    }

    // GraalVM Native Image, shared by the starters that apply the plugin:
    // test all starters with `./gradlew nativeTest --continue`, regenerate the metadata with
    // `./gradlew generateMetadata -Pagent`. See CONTRIBUTING.md.
    plugins.withId('org.graalvm.buildtools.native') {
        graalvmNative {
            metadataRepository {
                enabled = true
            }
            agent {
                // instrument the tests only when `-Pagent` is passed, so that `nativeTest`
                // validates the committed metadata instead of metadata generated on the fly
                defaultMode = 'conditional'
                enabled = false
                modes {
                    conditional {
                        userCodeFilterPath = "${rootDir}/native-image/user-code-filter.json"
                        extraFilterPath = "${rootDir}/native-image/extra-filter.json"
                    }
                }
                metadataCopy {
                    inputTaskNames.add('test')
                    outputDirectories.add("${rootDir}/dynamic-datasource-native-metadata/src/main/resources/META-INF/native-image/com.baomidou/dynamic-datasource-native-metadata")
                    mergeWithExisting = true
                }
            }
        }

        tasks.register('generateMetadata') {
            group = 'native'
            description = 'Runs the tests with the GraalVM Tracing Agent (-Pagent) and merges the generated reachability metadata.'
            dependsOn 'test', 'metadataCopy'
        }

        tasks.named('metadataCopy') {
            // metadataCopy consumes the agent output written by the instrumented `test` task
            mustRunAfter 'test'
        }
    }
}

// SBOM (CycloneDX)：只描述会传递给消费方的作用域。
// 默认作用域会把测试依赖（junit / h2 / spring-boot-starter-test 等）一并写入 BOM，
// 而这些构件根本不会传递给使用者（test 作用域不传递），列进去只会给漏洞扫描制造噪声。
// 注意：includeConfigs 只存在于 cyclonedxDirectBom，聚合任务 cyclonedxBom 没有该属性
//（给它设上会直接报 Could not set unknown property 'includeConfigs'），聚合结果由各模块的
// direct SBOM 合并而来，因此只配 direct 任务即可生效。
allprojects {
    tasks.matching { it.name == 'cyclonedxDirectBom' }.configureEach {
        includeConfigs = ['runtimeClasspath', 'compileClasspath']
    }
}

// 覆盖率聚合报告。为什么不用各模块自带的 jacocoTestReport：
// 测试代码全部集中在三个 starter 模块，被测的核心逻辑却在 dynamic-datasource-spring /
// -creator / -boot-common 里，而 JaCoCo 的模块级报告只统计本模块的 class 输出——核心模块
// 没有 test 任务，报告压根不生成，看起来像 0%；starter 模块的百分比也只反映它们自己那几个
// 自动装配类。这里用全部模块的 test.exec 去查这三个库模块的 class，得到的才是“真实被测覆盖率”。
//
// 聚合范围不含三个 starter：它们按 Boot2/3/4 各自携带同名类的不同副本
//（com.baomidou...check.SeataDataSourceProxyChecker、DsJakarta*Processor、*AutoConfiguration 等），
// 放进同一个 bundle 会让 JaCoCo 直接失败：
//   java.lang.IllegalStateException: Can't add different class with same name: ...
// Gradle 9.8 的 JacocoReport 没有 additionalGroupData（多 bundle）支持，已实测确认，
// 所以只能限定到无重名的模块。starter 层的覆盖率看各模块自己的 jacocoTestReport。
//
// 由 CI 显式调用（./gradlew jacocoRootReport），不接入 build/check。
apply plugin: 'jacoco'

jacoco {
    toolVersion = jacocoToolVersion
}

// 被测的库模块（即会上 Central 的核心代码）。新增模块时记得同步这里，
// 否则它会默默地从分母里消失——下面的校验就是防这个的。
def coverageModules = [
    'dynamic-datasource-creator',
    'dynamic-datasource-spring',
    'dynamic-datasource-spring-boot-common',
]

tasks.register('jacocoRootReport', JacocoReport) {
    group = 'verification'
    description = 'Coverage of the library modules, measured by tests that live in the starters'
    dependsOn subprojects.collect { it.path + ':test' }

    def targets = subprojects.findAll { it.name in coverageModules }
    if (targets.size() != coverageModules.size()) {
        def lost = coverageModules - targets*.name
        throw new GradleException("jacocoRootReport: coverage modules not found in this build: ${lost}. " +
            'Module renamed or removed? Update the coverageModules list in build.gradle rather than letting it drop out silently.')
    }

    // 执行数据仍然取全部模块：starter 里的测试会踩到库模块的代码，agent 记录的是运行时
    // 加载过的所有类；报告只会拿它去匹配下面三个模块的 class。
    executionData.from files(subprojects.collect { it.layout.buildDirectory.files('jacoco/test.exec') })
    classDirectories.from files(targets.collect { it.layout.buildDirectory.files('classes/java/main') })
    sourceDirectories.from files(targets.collect { it.file('src/main/java') })

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}
