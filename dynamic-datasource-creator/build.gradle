// Spring Boot 2.x 兼容模块 - JDK 8+
apply plugin: 'io.spring.dependency-management'

// Compile and test with a JDK 8 toolchain to keep the Boot 2 line JDK 8 compatible.
// Missing toolchains are auto-provisioned via Foojay (see settings.gradle).
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${libs.versions.springBoot2.get()}"
    }
}

dependencies {
    // 日志与 lombok（原由 root subprojects 统一注入，为避免隐式父项目属性查找下移到本模块）
    api(libs.slf4j.api)
    compileOnly(libs.lombok)
    annotationProcessor(libs.lombok)
    testAnnotationProcessor(libs.lombok)
    testCompileOnly(libs.lombok)

    compileOnly("org.springframework:spring-core")
    compileOnly(libs.druid)
    compileOnly(libs.hikaricp.java7)
    compileOnly(libs.beecp) {
        exclude group: "org.slf4j"
    }
    compileOnly(libs.c3p0)
    compileOnly(libs.oracle.ucp.spring.boot.starter)
    compileOnly(libs.oracle.ucp)
    compileOnly(libs.commons.dbcp2)
    compileOnly(libs.atomikos.transactions.jdbc)

    // 单元测试：JUnit5 + AssertJ，版本由上方 spring-boot-2 BOM 统一管理（JDK8 兼容）
    testImplementation("org.junit.jupiter:junit-jupiter")
    testImplementation("org.assertj:assertj-core")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")

    // 直接创建各连接池数据源的测试（#821）：连接池在 main 里是 compileOnly，测试需要再声明一次
    testImplementation(libs.hikaricp.java7)
    testImplementation(libs.beecp) {
        exclude group: "org.slf4j"
    }
    testImplementation(libs.commons.dbcp2)
    // Boot 2 BOM 为 commons-dbcp2 排除了 commons-logging，与 Spring Boot 应用一样由 spring-jcl 提供
    testRuntimeOnly("org.springframework:spring-jcl")
    testImplementation(libs.c3p0)
    testImplementation(libs.oracle.ucp)
    // PoolDataSourceImpl 的方法签名引用了 ojdbc 的类型，缺少 ojdbc 时反射读取它的属性就会失败。
    // main 里 oracle-spring-boot-starter-ucp 带的是 ojdbc11，JDK 8 加载不了，因此单独引入 ojdbc8
    testRuntimeOnly(libs.oracle.ojdbc8)
    testRuntimeOnly(libs.h2)
}

