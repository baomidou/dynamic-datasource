// Spring Boot 2.x Starter - JDK 8+
apply plugin: 'io.spring.dependency-management'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    // Compile and test with a JDK 8 toolchain to keep the Boot 2 line JDK 8 compatible.
    // Missing toolchains are auto-provisioned via Foojay (see settings.gradle).
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${libs.versions.springBoot2.get()}"
    }
}

dependencies {
    // 日志与 lombok（原由 root subprojects 统一注入，为避免隐式父项目属性查找下移到本模块）
    api(libs.slf4j.api)
    compileOnly(libs.lombok)
    annotationProcessor(libs.lombok)
    testAnnotationProcessor(libs.lombok)
    testCompileOnly(libs.lombok)

    api project(":dynamic-datasource-spring-boot-common")
    
    compileOnly("org.springframework.boot:spring-boot-starter-web")
    compileOnly(libs.druid.spring.boot.starter)
    compileOnly("org.springframework.boot:spring-boot-starter-actuator")
    compileOnly("com.zaxxer:HikariCP")
    compileOnly("org.springframework.boot:spring-boot-configuration-processor")
    annotationProcessor("org.springframework.boot:spring-boot-configuration-processor")
    
    testImplementation(project(":dynamic-datasource-test-common"))
    testImplementation(testFixtures(project(":dynamic-datasource-test-common")))
    testImplementation(libs.h2)
    testImplementation("org.springframework.boot:spring-boot-starter-test")
    testImplementation("org.springframework.boot:spring-boot-starter-web")
    // Make compileOnly dependencies available for tests
    testRuntimeOnly(libs.druid.spring.boot.starter)
    testRuntimeOnly("com.zaxxer:HikariCP")
    // Fix JUnit Platform version incompatibility (required for tests on Gradle 9 + JDK 25)
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}
