// Spring Boot 4.x Starter - JDK 17+
plugins {
    // Spring Boot version: libs.versions.springBoot4 in gradle/libs.versions.toml
    id 'org.springframework.boot' version '4.0.0'
    // GraalVM `nativeTest`; the shared configuration lives in the root build
    id 'org.graalvm.buildtools.native'
}

apply plugin: 'io.spring.dependency-management'

java {
    // Build and test on a dedicated JDK 17 toolchain (auto-provisioned via Foojay),
    // so compilation no longer links against APIs of newer JDKs (e.g. 21/25) that
    // happen to be installed on the developer/CI machine.
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// library module: only the plain jar is assembled and published
tasks.named('bootJar') {
    enabled = false
}

// no main class: main AOT is not applicable, `nativeTest` only needs the test AOT
tasks.named('processAot') {
    enabled = false
}

tasks.named('jar') {
    archiveClassifier = ''
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${libs.versions.springBoot4.get()}"
    }
}

dependencies {
    // 日志与 lombok（原由 root subprojects 统一注入，为避免隐式父项目属性查找下移到本模块）
    api(libs.slf4j.api)
    compileOnly(libs.lombok)
    annotationProcessor(libs.lombok)
    testAnnotationProcessor(libs.lombok)
    testCompileOnly(libs.lombok)

    api project(":dynamic-datasource-spring-boot-common")
    // GraalVM Reachability Metadata for native-image builds (resources only, no Java code)
    implementation project(":dynamic-datasource-native-metadata")
    
    compileOnly("org.springframework.boot:spring-boot-starter-web")
    compileOnly("org.springframework.boot:spring-boot-jdbc")
    // Druid's Boot 4 starter is published since 1.2.28; exclude its bundled Spring Boot
    // artifacts so versions stay managed by the spring-boot-dependencies BOM (same as Boot3 module)
    compileOnly(libs.druid.boot4.starter) {
        exclude group: "org.springframework.boot"
    }
    compileOnly("org.springframework.boot:spring-boot-starter-actuator")
    compileOnly("com.zaxxer:HikariCP")
    compileOnly("org.springframework.boot:spring-boot-configuration-processor")
    annotationProcessor("org.springframework.boot:spring-boot-configuration-processor")
    
    testImplementation(project(":dynamic-datasource-test-common"))
    testImplementation(testFixtures(project(":dynamic-datasource-test-common")))
    testImplementation(libs.h2)
    testImplementation("org.springframework.boot:spring-boot-starter-test")
    testImplementation("org.springframework.boot:spring-boot-starter-web")
    testImplementation("org.springframework.boot:spring-boot-starter-jdbc")
    // Make compileOnly dependencies available for tests
    testRuntimeOnly(libs.druid.boot4.starter)
    testRuntimeOnly("com.zaxxer:HikariCP")
    // endpoint 注册回归测试需要 actuator 在测试运行时存在
    testRuntimeOnly("org.springframework.boot:spring-boot-starter-actuator")
    // Fix JUnit Platform version incompatibility with Spring Boot 4.0.0
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}
