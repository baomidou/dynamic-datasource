// Spring Boot 4.x Starter - JDK 17+
apply plugin: 'io.spring.dependency-management'

java {
    // Build and test on a dedicated JDK 17 toolchain (auto-provisioned via Foojay),
    // so compilation no longer links against APIs of newer JDKs (e.g. 21/25) that
    // happen to be installed on the developer/CI machine.
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBoot4Version}"
    }
}

dependencies {
    api project(":dynamic-datasource-spring-boot-common")
    api("org.mybatis:mybatis-spring:4.0.0")
    
    compileOnly("org.springframework.boot:spring-boot-starter-web")
    compileOnly("org.springframework.boot:spring-boot-jdbc")
    // Druid's Boot 4 starter is published since 1.2.28; exclude its bundled Spring Boot
    // artifacts so versions stay managed by the spring-boot-dependencies BOM (same as Boot3 module)
    compileOnly("com.alibaba:druid-spring-boot-4-starter:${druidSpringBoot4Version}") {
        exclude group: "org.springframework.boot"
    }
    compileOnly("org.springframework.boot:spring-boot-starter-actuator")
    compileOnly("com.zaxxer:HikariCP")
    compileOnly("org.springframework.boot:spring-boot-configuration-processor")
    annotationProcessor("org.springframework.boot:spring-boot-configuration-processor")
    
    testImplementation(project(":dynamic-datasource-test-common"))
    testImplementation("com.h2database:h2:${h2Version}")
    testImplementation("org.springframework.boot:spring-boot-starter-test")
    testImplementation("org.springframework.boot:spring-boot-starter-web")
    testImplementation("org.springframework.boot:spring-boot-starter-jdbc")
    // Make compileOnly dependencies available for tests
    testRuntimeOnly("com.alibaba:druid-spring-boot-4-starter:${druidSpringBoot4Version}")
    testRuntimeOnly("com.zaxxer:HikariCP")
    // Fix JUnit Platform version incompatibility with Spring Boot 4.0.0
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}
