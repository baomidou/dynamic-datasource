// Spring Boot 2.x 兼容模块 - JDK 8+
apply plugin: 'io.spring.dependency-management'

// Compile and test with a JDK 8 toolchain to keep the Boot 2 line JDK 8 compatible.
// Missing toolchains are auto-provisioned via Foojay (see settings.gradle).
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${libs.versions.springBoot2.get()}"
    }
}

dependencies {
    // 日志与 lombok（原由 root subprojects 统一注入，为避免隐式父项目属性查找下移到本模块）
    api(libs.slf4j.api)
    compileOnly(libs.lombok)
    annotationProcessor(libs.lombok)
    testAnnotationProcessor(libs.lombok)
    testCompileOnly(libs.lombok)

    api project(":dynamic-datasource-creator")

    // Third-party dependencies
    compileOnly(libs.mybatis.plus)
    // 只有 AtomikosTransactionFactory 用到；由使用方的 MyBatis / MyBatis-Plus starter 提供，不随本库传递（#811）
    compileOnly(libs.mybatis.springBoot)
    compileOnly(libs.p6spy)
    compileOnly(libs.seata.rm.datasource) {
        exclude group: "com.alibaba", module:"druid"
    }
    
    // Spring dependencies
    api("org.springframework:spring-core")
    api("org.springframework:spring-beans")
    api("org.springframework:spring-context")
    api("org.springframework:spring-jdbc")
    api("org.springframework:spring-aop")
    api("org.springframework:spring-expression")

    // 单元测试：JUnit5 + AssertJ + Mockito，版本由上方 spring-boot-2 BOM 统一管理
    testImplementation("org.junit.jupiter:junit-jupiter")
    testImplementation("org.assertj:assertj-core")
    testImplementation("org.mockito:mockito-core")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    // MasterSlaveAutoRoutingPlugin 依赖 org.apache.ibatis（主源经 compileOnly mybatis-plus 可见，
    // 但 testCompile 不继承 compileOnly），故为插件单测重新引入；仅 test 作用域，不影响发布构件。
    testImplementation(libs.p6spy)
    testImplementation(libs.seata.rm.datasource) {
        exclude group: "com.alibaba", module: "druid"
    }
    testImplementation(libs.mybatis.plus)
}
