// Test Common Module - NOT published
// This module contains shared test code for all starter modules
apply plugin: 'io.spring.dependency-management'

// Compile and test with a JDK 8 toolchain to keep the Boot 2 line JDK 8 compatible.
// Missing toolchains are auto-provisioned via Foojay (see settings.gradle).
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

// Do not publish this module - disable all publishing tasks
if (JavaVersion.current() >= JavaVersion.VERSION_11) {
    tasks.withType(PublishToMavenRepository).configureEach {
        enabled = false
    }
    tasks.withType(PublishToMavenLocal).configureEach {
        enabled = false
    }
    // Skip signing for this module
    tasks.withType(Sign).configureEach {
        enabled = false
    }
}

// 同上：本模块不上 Central，因此也不能出现在对外分发的聚合 SBOM 里。
// 用 enabled = false 而非 onlyIf：聚合任务把各模块的 direct SBOM 视为必需生产者，
// 仅执行期跳过会让 cyclonedxBom 因缺输出而失败。
tasks.matching { it.name == 'cyclonedxDirectBom' }.configureEach {
    enabled = false
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${libs.versions.springBoot2.get()}"
    }
}

dependencies {
    // 日志与 lombok（原由 root subprojects 统一注入，为避免隐式父项目属性查找下移到本模块）
    api(libs.slf4j.api)
    compileOnly(libs.lombok)
    annotationProcessor(libs.lombok)
    testAnnotationProcessor(libs.lombok)
    testCompileOnly(libs.lombok)

    api project(":dynamic-datasource-spring-boot-common")
    
    compileOnly("org.springframework:spring-web")
    compileOnly("org.springframework:spring-tx")
}
