# ====================================
# Project Configuration
# ====================================
APP_GROUP=com.baomidou
APP_VERSION=4.7.0
# ====================================
# Gradle Build Optimization
# ====================================
# Enable build cache for faster incremental builds
org.gradle.caching=true
# Enable parallel build execution
org.gradle.parallel=true
# Configure JVM heap size for Gradle daemon
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Enable configuration cache (Gradle 8.x+); problems are reported as warnings
# so a single incompatible plugin cannot break local/CI builds
# NOTE: publishing tasks must run with --no-configuration-cache (see release.yml):
# io.spring.dependency-management's POM withXml() is not cache-safe
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
# ====================================
# Maven Central Publishing Configuration
# ====================================
# vanniktech 0.34+ 的新属性名（SONATYPE_HOST / RELEASE_SIGNING_ENABLED 已废弃）：
#   mavenCentralPublishing=true  替代 SONATYPE_HOST=CENTRAL_PORTAL
#   signAllPublications=true     替代 RELEASE_SIGNING_ENABLED=true
mavenCentralPublishing=true
signAllPublications=true
# 上传到 Central Portal 后由插件自动等待验证通过（VALIDATED）并触发发布，
# 否则每次发版都会停在 Deployments 页面等人工点 Publish（4.6.0 即如此）。
# 只在 release.yml 的发布任务中生效，普通构建/本地无感。
mavenCentralAutomaticPublishing=true

POM_NAME=dynamic-datasource
POM_DESCRIPTION=dynamic datasource for spring boot
POM_INCEPTION_YEAR=2018
POM_URL=https://github.com/baomidou/dynamic-datasource/

POM_LICENSE_NAME=Apache License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0
POM_LICENSE_DIST=repo

# Canonical repository name. The historical name dynamic-datasource-spring-boot-starter only
# survives as an HTML redirect (301); the GitHub API returns 404 for it, so POM links must not use it.
POM_SCM_URL=https://github.com/baomidou/dynamic-datasource/
POM_SCM_CONNECTION=scm:git:git://github.com/baomidou/dynamic-datasource.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/baomidou/dynamic-datasource.git

POM_DEVELOPER_ID=TaoYu
POM_DEVELOPER_NAME=TaoYu
POM_DEVELOPER_URL=https://github.com/baomidou/dynamic-datasource
POM_DEVELOPER_EMAIL=tracy5546@gmail.com
