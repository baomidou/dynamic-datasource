# osv-scanner 忽略清单（.github/workflows/dependency-scan.yml 扫描 SBOM 时自动读取本文件）。
#
# 背景：SBOM 只包含会发布给消费方的作用域（runtimeClasspath），其中 Boot 2 线固定为
# Spring Boot 2.7.18 / Spring Framework 5.3.31。该组合的 OSS 支持均已 EOL（Boot 2.7 止于
# 2023-11，Spring 5.3 OSS 止于 2024-08），下列 CVE 的修复只存在于跨大版本线（Spring 6.x /
# Boot 3.x+），本库为保持 Boot 2 兼容无法跨越，经评审后按条目忽略。
# Boot 3/4 线不在此列：一旦命中应升级对应 patch 版本修复，而不是加进本清单。
#
# 维护约定：每出现新的 Boot 2 线 CVE 需新增条目并评审；若存在同线修复版本则优先升级而非忽略。
# 格式参考：https://google.github.io/osv-scanner/configuration/

